services:
  zapret:
    build: .
    image: ghcr.io/olluorg/yt-dlp-dpi:latest
    container_name: yt-dlp-dpi

    cap_add:
      - NET_ADMIN
      - NET_RAW

    network_mode: host
    restart: unless-stopped

    environment:
      - NFQUEUE_NUM=200
      - SERVER_PORT=8080
      - NFQWS2_OPT=--lua-desync=multidisorder:pos=1,midsld

    volumes:
      - ./downloads:/downloads
      # - ./cookies.txt:/cookies.txt:ro
